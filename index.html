<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ema'a – Team Links</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="logo">E</div>
  <h1>Ema'a</h1>
  <p class="sub">Graduation project · team links</p>

  <div id="list"></div>

  <form id="addForm" autocomplete="off">
    <input id="title" placeholder="Title (e.g. Dataset sheet)" maxlength="60" required>
    <input id="url" placeholder="Link (https://...)" inputmode="url" required>
    <div class="err" id="err" role="alert"></div>
    <button type="submit">+ Add link</button>
  </form>
  <p class="note">Everyone on the team sees the same list. Tap × to remove a link.</p>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
